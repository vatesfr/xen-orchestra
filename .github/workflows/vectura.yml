name: Vectura

# only when vectura changes: the rest of the repository does not build it
#
# pull requests rather than every push: GitHub filters a push on the diff with
# the previous push, which after a rebase on `master` (or a merge of it)
# contains the vectura changes of `master`, whereas it filters a pull request
# on the diff with the merge base, i.e. the changes of the branch only
on:
  pull_request:
    branches:
      - arm64_support
    paths:
      - '@xen-orchestra/vmware-explorer/vectura/**'
      - .github/workflows/vectura.yml
  push:
    branches:
      - arm64_support
    paths:
      - '@xen-orchestra/vmware-explorer/vectura/**'
      - .github/workflows/vectura.yml

defaults:
  run:
    working-directory: '@xen-orchestra/vmware-explorer/vectura'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v4

      # rustup, on the runner image, installs the toolchain rust-toolchain.toml
      # names on the first cargo command
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

      # https://github.com/taiki-e/install-action
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.8.5

      - run: cargo deny --locked check
      - run: cargo llvm-cov --locked --json --summary-only --output-path target/coverage.json
      - name: Hold the coverage floor
        run: cargo test --locked --test coverage -- --ignored

  # builds the binary as release.sh does, checks it, then checks the one in git,
  # which xo-server runs, is that build
  binary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v4

      # https://github.com/mlugg/setup-zig
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # https://github.com/taiki-e/install-action
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4

      - run: rustup target add ${{ matrix.arch }}-unknown-linux-gnu

      - run: scripts/build.sh "$RUNNER_TEMP/build" ${{ matrix.arch }}
      - run: scripts/check-binary.sh "$RUNNER_TEMP/build/vectura"

      # the build is downloadable from the summary page of the workflow run
      # https://github.com/actions/upload-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: vectura-${{ matrix.arch }}
          path: ${{ runner.temp }}/build/vectura
          if-no-files-found: error

      - name: The binary in git is the build of these sources
        run: |
          if [ "${{ matrix.arch }}" = aarch64 ]; then file=vectura-aarch64; else file=vectura; fi
          cmp "$RUNNER_TEMP/build/vectura" "$file" || {
            echo "::error::$file is not the build of these sources: run scripts/release.sh in vectura/ and commit the binaries"
            exit 1
          }
