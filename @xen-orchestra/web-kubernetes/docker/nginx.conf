server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/xo-web-kubernetes;

    gzip on;
    gzip_types application/javascript text/css application/json;

    # Liveness/readiness probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # XO 6 loads the plugin as ES modules from another origin: CORS is required. The plugin only contains public code,
    # without credentials or data, so any origin is allowed.

    # Entry point of the plugin: always revalidated, so that a new version is picked up on the next XO 6 load
    location = /remoteEntry.js {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed chunks and styles
    location /assets/ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }
}
